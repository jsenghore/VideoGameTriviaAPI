plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter' // Core Spring Boot functionality
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // JPA for database access
    implementation 'org.springframework.boot:spring-boot-starter-web' // REST APIs
    implementation 'mysql:mysql-connector-java' // MySQL database driver
    implementation 'org.springframework.boot:spring-boot-starter-scheduling' // Scheduling tasks
    implementation 'org.springframework.boot:spring-boot-starter-validation' // For input validation
    implementation 'org.springframework.boot:spring-boot-starter-actuator' // For monitoring and management
    testImplementation 'org.springframework.boot:spring-boot-starter-test' // Testing support
    implementation 'javax.persistence:javax.persistence-api:2.2'
}

tasks.named('test') {
    useJUnitPlatform()
}
